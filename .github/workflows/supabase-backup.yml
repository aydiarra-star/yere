name: Sauvegarde Supabase YÉRÉ

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yere-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Exporter, chiffrer et archiver la base métier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Vérifier la configuration
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Le secret SUPABASE_DB_URL est absent."
            exit 1
          fi
          if [[ ! "$BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::La variable BACKUP_AGE_RECIPIENT est absente ou invalide."
            exit 1
          fi

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Installer age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Exporter schéma, données et historique des migrations
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup

          # GitHub-hosted runners are IPv4-only. Supabase direct DB endpoints
          # are IPv6-only on projects without the IPv4 add-on. Convert only
          # this project's known direct URL to its shared SESSION pooler URL
          # (port 5432), which supports pg_dump. Never print the credential URL.
          BACKUP_DB_URL="$(python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import urlsplit

          url = os.environ["SUPABASE_DB_URL"]
          project_ref = "anphzspjnnhzcqzwhpsg"
          direct_host = f"db.{project_ref}.supabase.co"
          pooler_host = "aws-1-eu-west-3.pooler.supabase.com"

          try:
              parts = urlsplit(url)
              username = parts.username or ""
              host = parts.hostname or ""
              password = parts.password
              port = parts.port or 5432
          except ValueError:
              print("URL PostgreSQL SUPABASE_DB_URL invalide.", file=sys.stderr)
              sys.exit(1)

          if host == direct_host:
              if username != "postgres" or password is None:
                  print("L'URL directe YÉRÉ doit utiliser l'utilisateur postgres et un mot de passe.", file=sys.stderr)
                  sys.exit(1)
              # Preserve the already URL-encoded password exactly as supplied.
              authority = url.split("://", 1)[1].split("@", 1)[0]
              raw_password = authority.split(":", 1)[1] if ":" in authority else ""
              if not raw_password:
                  print("Mot de passe absent de SUPABASE_DB_URL.", file=sys.stderr)
                  sys.exit(1)
              url = re.sub(
                  r"^(postgres(?:ql)?://)postgres:",
                  rf"\1postgres.{project_ref}:",
                  url,
                  count=1,
              )
              url = url.replace(f"@{direct_host}:{port}/", f"@{pooler_host}:5432/", 1)
              print("Connexion directe IPv6 convertie en pooler de session IPv4.", file=sys.stderr)
          elif host == pooler_host:
              if username != f"postgres.{project_ref}" or port != 5432:
                  print("Le pooler doit utiliser postgres.<project-ref> sur le port 5432 (session mode).", file=sys.stderr)
                  sys.exit(1)
              print("Pooler de session IPv4 déjà configuré.", file=sys.stderr)
          else:
              print("Hôte PostgreSQL inattendu pour le projet YÉRÉ; vérifiez le secret SUPABASE_DB_URL.", file=sys.stderr)
              sys.exit(1)

          print(url)
          PY
          )"

          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/data.sql --use-copy --data-only
          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/migration-history-schema.sql --schema supabase_migrations
          supabase db dump --db-url "$BACKUP_DB_URL" -f backup/migration-history-data.sql --use-copy --data-only --schema supabase_migrations
          test -s backup/schema.sql
          test -s backup/data.sql
          printf 'Projet: YÉRÉ\nDate UTC: %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > backup/README.txt
          tar -czf yere-db-backup.tar.gz -C backup .
          test -s yere-db-backup.tar.gz

      - name: Chiffrer l'archive avant tout téléversement
        shell: bash
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" --output yere-db-backup.tar.gz.age yere-db-backup.tar.gz
          rm -f yere-db-backup.tar.gz
          sha256sum yere-db-backup.tar.gz.age > yere-db-backup.tar.gz.age.sha256
          test -s yere-db-backup.tar.gz.age

      - name: Déposer uniquement l'archive chiffrée (14 jours)
        uses: actions/upload-artifact@v4
        with:
          name: yere-supabase-backup-${{ github.run_id }}
          path: |
            yere-db-backup.tar.gz.age
            yere-db-backup.tar.gz.age.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
